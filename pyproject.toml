[project]
name = "dictionary-web-scraping-machine"
version = "1.0.0"
description = "CLI dictionary that scrapes definitions and pronunciations from Merriam-Webster."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mai Tan Duc", email = "ducmai.network@gmail.com" }]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# S = flake8-bandit security checks, C4 = comprehension idioms, SIM = simplifications.
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
# UP009: keep the traditional `# -*- coding: utf-8 -*-` header used across
# this project's file banners; it's harmless and consistent with house style.
ignore = ["UP009"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert` and run the CLI as a subprocess.
"tests/*" = ["S101", "S602", "S603"]

[tool.mypy]
python_version = "3.10"
# Type-check every module in the project folder (tests are exempt), so a new
# module is covered automatically; plain `mypy` is all CI has to run.
files = ["."]
exclude = "^(tests|build|\\.?venv)/"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
# Measure every module in the project folder, so new modules are included
# automatically instead of having to be listed here.
source = ["."]
omit = ["tests/*", "build/*", ".venv/*", "venv/*"]

[tool.coverage.report]
fail_under = 90
