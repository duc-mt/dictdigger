name: 🛡️ Scorecard

# OpenSSF Scorecard grades the repository's supply-chain hygiene (branch
# protection, pinned dependencies, security policy, ...) and reports it under
# Security > Code scanning. Publishing results requires a public repository.

on:
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 2"
  push:
    branches: [master, main]

permissions: read-all

jobs:
  analysis:
    name: ⤵️ OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the SARIF report
      id-token: write # publish results to the OpenSSF API
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
