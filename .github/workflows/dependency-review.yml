name: 🔍 Dependency Review

# Blocks pull requests that add or bump a dependency with a known
# vulnerability. Needs the repository's dependency graph enabled (it is by
# default for public repositories).

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: ⤵️ Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
