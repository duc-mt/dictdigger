name: 🔐 Secret Scan

# Scans the full git history for committed credentials (API keys, tokens,
# private keys). Free for personal accounts; repositories owned by an
# organisation need a GITLEAKS_LICENSE secret (see the gitleaks-action docs).

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: ⤵️ Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
