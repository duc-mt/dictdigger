name: 🐍 CI

on:
  pull_request:
  push:
    branches: [master, main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ⤵️ Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: black --check
        run: black --check .

  typecheck:
    name: ⤵️ Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: mypy

  test:
    name: ⤵️ Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # pygame needs an audio backend even for headless import/tests.
      SDL_AUDIODRIVER: dummy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov-report=xml  # fails below the coverage floor in pyproject.toml
      - name: CLI smoke test (needs no network)
        run: |
          python run.py --help > /dev/null
          python run.py --history --data-dir "$RUNNER_TEMP/smoke"
      - name: Web interface smoke test (needs no network)
        # A pure-Python check, deliberately avoiding shell job control
        # (backgrounding + kill + wait): an earlier bash version of this step
        # hung until the job's timeout, because a plain `wait` on a
        # long-lived server process has no bound of its own. subprocess and
        # threading give every blocking call here an explicit timeout.
        run: |
          python - <<'PY'
          import re, subprocess, sys, tempfile, threading, urllib.request

          proc = subprocess.Popen(
              [sys.executable, "run.py", "--serve", "--port", "0", "--no-cache",
               "--data-dir", tempfile.mkdtemp()],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              env={**__import__("os").environ, "PYTHONUNBUFFERED": "1"}
          )
          try:
              first_line = []
              reader = threading.Thread(
                  target=lambda: first_line.append(proc.stdout.readline()),
                  daemon=True,
              )
              reader.start()
              reader.join(timeout=30)
              if not first_line:
                  sys.exit("the server printed nothing within 30s")
              print(first_line[0], end="")
              match = re.search(r":(\d+)/", first_line[0])
              if not match:
                  sys.exit(f"could not find a port in: {first_line[0]!r}")
              body = urllib.request.urlopen(
                  f"http://127.0.0.1:{match.group(1)}/", timeout=10
              ).read()
              assert b"Look up" in body, "unexpected home page content"
              print("web interface smoke test: OK")
          finally:
              proc.kill()
              proc.wait(timeout=10)
          PY
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  dependency-audit:
    name: ⤵️ Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
